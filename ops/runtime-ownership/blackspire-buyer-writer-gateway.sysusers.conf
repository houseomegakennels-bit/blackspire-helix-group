# Private service identity for the Buyer Writer gateway.
# systemd-sysusers creates the matching private primary group.  Deliberately
# do not add this account to `blackspire` or any other supplementary group;
# the unit supplies only its narrowly scoped socket/config runtime groups.
u blackspire-writer - "Blackspire Buyer Writer gateway" /nonexistent /usr/sbin/nologin
