# Dedicated gateway-only configuration root.  It is intentionally not below
# /etc/blackspire because that parent is root:blackspire 0750 and granting the
# writer traversal would cross the application configuration boundary.
d /etc/blackspire-buyer-writer-gateway 0750 root blackspire-writer -

# The writer owns the local transport while the API-specific group receives
# connect access.  No TCP listener is created by this contract.
d /run/blackspire 0750 blackspire-writer blackspire-api -
