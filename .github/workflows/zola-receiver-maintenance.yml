name: ZOLA receiver maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Reviewed exclusive routing canary; default makes no routing mutation
        type: choice
        options: [audit, provision-missing, run-exclusive-reviewed-canary, cleanup-exclusive-reviewed-canary]
        default: audit
        required: true
      expected_head:
        description: Exact reviewed release SHA (40 lowercase hex characters)
        type: string
        required: true
      canary_nonce:
        description: Reviewed unique canary nonce (32 lowercase hex characters)
        type: string
        required: true
  push:
    branches: [release/zola-production-live]
    paths:
      - .github/workflows/zola-receiver-maintenance.yml
      - scripts/zola-receiver-maintenance.mjs
      - scripts/zola-receiver-rebuild.mjs
      - scripts/zola-receiver-prebuilt.mjs
      - scripts/zola-vercel-protection-inventory.mjs
      - tests/zola-vercel-protection-inventory.test.js
      - scripts/zola-routing-canary.mjs
      - tests/zola-routing-canary.test.js
      - scripts/zola-routing-canary-reconcile.mjs
      - tests/zola-routing-canary-reconcile.test.js

permissions:
  contents: read

concurrency:
  group: zola-receiver-maintenance
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'houseomegakennels-bit/blackspire-helix-group' && github.ref == 'refs/heads/release/zola-production-live'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Bind receiver provisioning to the exact reviewed head
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'provision-missing'
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ACTUAL_HEAD: ${{ github.sha }}
        run: test "$EXPECTED_HEAD" = "$ACTUAL_HEAD" && test "${#EXPECTED_HEAD}" -eq 40
      - name: Reconcile approved missing settings and audit without disclosing values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZOLA_CAPABILITY_TOKEN: ${{ secrets.ZOLA_CAPABILITY_TOKEN }}
          ZOLA_AUTHORITY_CONSUMER_URL: ${{ vars.ZOLA_AUTHORITY_CONSUMER_URL }}
          ZOLA_AUTHORITY_CONSUMER_TOKEN: ${{ secrets.ZOLA_AUTHORITY_CONSUMER_TOKEN }}
          # One explicitly reviewed transition; subsequent pushes only audit.
          ZOLA_RECEIVER_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'provision-missing' && 'provision-missing' || github.event.before == '87f4b4d137e087e53b6c79bd4d22b32c91fe0401' && 'provision-missing' || 'audit' }}
        run: node scripts/zola-receiver-maintenance.mjs
      - name: Rebuild the approved candidate and unchanged production main
        if: github.event.before == '7072d929adce6766fb1e7e4adf56683002bd9068'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZOLA_CAPABILITY_TOKEN: ${{ secrets.ZOLA_CAPABILITY_TOKEN }}
          ZOLA_AUTHORITY_CONSUMER_URL: ${{ vars.ZOLA_AUTHORITY_CONSUMER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/zola-receiver-rebuild.mjs
      - name: Install pinned CLI for the reviewed prebuilt transition
        if: github.event.before == '8ffc7b261ac2c4c98e544de473c8316b8bbd75ad'
        run: npm install --prefix "$RUNNER_TEMP/zola-vercel-cli" --ignore-scripts --no-audit --no-fund vercel@59.11.7
      - name: Build and verify exact sources with the supported prebuilt workflow
        if: github.event.before == '8ffc7b261ac2c4c98e544de473c8316b8bbd75ad'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZOLA_CAPABILITY_TOKEN: ${{ secrets.ZOLA_CAPABILITY_TOKEN }}
          ZOLA_AUTHORITY_CONSUMER_URL: ${{ vars.ZOLA_AUTHORITY_CONSUMER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          ZOLA_VERCEL_BIN: ${{ runner.temp }}/zola-vercel-cli/node_modules/.bin/vercel
        run: node scripts/zola-receiver-prebuilt.mjs

      - name: Inventory rollback deployment protections (read only)
        id: routing_inventory
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/zola-vercel-protection-inventory.mjs
      - name: Retain sanitized rollback protection inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zola-vercel-protection-inventory-${{ github.sha }}
          path: zola-vercel-protection-inventory.json
          if-no-files-found: error
          retention-days: 7

      # One reviewed transition: only a random unused path changes to 418,
      # then the exact canary is removed. All application authentication remains unchanged.
      # Other pushes stay read-only. A same-head rerun uses the same bounded canary.
      - name: Exercise the explicitly reviewed unique routing canary
        if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.action == 'run-exclusive-reviewed-canary' || inputs.action == 'cleanup-exclusive-reviewed-canary') && inputs.expected_head == github.sha) || (github.event_name == 'push' && github.event.before == '6ccfd4602e852b600b242abfd77b05ed5e0eea3c'))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZOLA_CANARY_ACTION: ${{ github.event_name == 'push' && 'run-exclusive-reviewed-canary' || inputs.action }}
          ZOLA_CANARY_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_head }}
          ZOLA_CANARY_NONCE: ${{ github.event_name == 'push' && 'dadcc16451f1b9a1e2ac47f3cdc27103' || inputs.canary_nonce }}
        run: node scripts/zola-routing-canary.mjs
      - name: Retain routing canary intent journal even after failure
        if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.action == 'run-exclusive-reviewed-canary' || inputs.action == 'cleanup-exclusive-reviewed-canary')) || (github.event_name == 'push' && github.event.before == '6ccfd4602e852b600b242abfd77b05ed5e0eea3c'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zola-routing-canary-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: zola-routing-canary-evidence/
          if-no-files-found: error
          retention-days: 7

      # Exact recovery of the single UNPUBLISHED canary from run34190899875/2.
      # This transition can only GET and DISCARD that stage after independent
      # identity/byte/non-live verification. It cannot create or promote rules.
      - name: Reconcile and discard the exact retained unpublished canary
        if: always() && github.event_name == 'push' && github.event.before == '809547e1fbac46fccca49dcbf1e88df953e7444b'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ZOLA_CANARY_EXPECTED_SHA: ${{ github.sha }}
          ZOLA_CANARY_RECONCILE_ACTION: discard-known-stage
        run: node scripts/zola-routing-canary-reconcile.mjs
      - name: Retain exact-stage reconciliation journal even after failure
        if: always() && github.event_name == 'push' && github.event.before == '809547e1fbac46fccca49dcbf1e88df953e7444b'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zola-routing-reconcile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: zola-routing-reconcile-evidence/
          if-no-files-found: error
          retention-days: 7
