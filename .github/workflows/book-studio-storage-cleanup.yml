name: Book Studio storage cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: dry-run or execute"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - execute

permissions:
  contents: read

jobs:
  cleanup:
    name: Run Book Studio storage cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run cleanup
        working-directory: frontend
        run: npx tsx scripts/book-studio/storage-cleanup.mts --${{ inputs.mode }}
