name: Book Studio storage cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: dry-run or execute"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - execute

permissions:
  contents: read

jobs:
  cleanup:
    name: Run Book Studio storage cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_CaRyRaulJaFnCLSfTdyRYNIW
      VERCEL_PROJECT_ID: prj_a9x4Tuzgzq6XrvtdtYNxONwL8Fou
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel production environment
        working-directory: frontend
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID }))"
          vercel env pull .env.production.local --environment=production --yes --token "$VERCEL_TOKEN"

      - name: Run cleanup
        working-directory: frontend
        run: |
          set -a
          source .env.production.local
          set +a
          export SUPABASE_URL="https://kchtrvfcixnimvxxctkj.supabase.co"
          npx tsx scripts/book-studio/storage-cleanup.mts --${{ inputs.mode }}
