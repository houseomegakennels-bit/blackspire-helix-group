name: Geminara one-time storage recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/geminara-one-time-storage-recovery.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_CaRyRaulJaFnCLSfTdyRYNIW
      VERCEL_PROJECT_ID: prj_a9x4Tuzgzq6XrvtdtYNxONwL8Fou
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel production environment
        working-directory: frontend
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID }))"
          vercel env pull .env.production.local --environment=production --yes --token "$VERCEL_TOKEN"

      - name: Recover Geminara storage while preserving all active videos
        working-directory: frontend
        run: |
          set -a
          source .env.production.local
          set +a
          export SUPABASE_URL="https://kchtrvfcixnimvxxctkj.supabase.co"
          node --input-type=module <<'JS'
          import { createClient } from '@supabase/supabase-js';

          const BOOK_ID = 'book_hk7iuemqv2j5ld';
          const BUCKET = 'blackspire-book-studio';
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });

          const extraOrphans = [
            'book_hk7iuemqv2j5ld/chapter_audio/asset_3fuzyemra87391-chapter-one.wav',
            'book_hk7iuemqv2j5ld/chapter_audio/asset_ihb164mra897kt-chapter-one.wav',
            'book_hk7iuemqv2j5ld/reference_image/asset_ykn7zdmqv3dvkq-Geminara-The-World-Bible-Final-Production-Edition-1--reference-37.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_49gs1emqv3dwkl-Geminara-The-World-Bible-Final-Production-Edition-1--reference-38.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_xffjtomqv3dues-Geminara-The-World-Bible-Final-Production-Edition-1--reference-36.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_rv4cwrmqv3cxut-Geminara-The-World-Bible-Final-Production-Edition-1--reference-3.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_tpzfeimqv3cytk-Geminara-The-World-Bible-Final-Production-Edition-1--reference-4.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_omxyecmqv3d3um-Geminara-The-World-Bible-Final-Production-Edition-1--reference-9.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_6k7cyqmqv3dte3-Geminara-The-World-Bible-Final-Production-Edition-1--reference-35.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_k3523wmqv3d4yc-Geminara-The-World-Bible-Final-Production-Edition-1--reference-10.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_hmi372mqv3d1ub-Geminara-The-World-Bible-Final-Production-Edition-1--reference-7.jpg',
            'book_hk7iuemqv2j5ld/reference_image/asset_03v9ammqv3dagm-Geminara-The-World-Bible-Final-Production-Edition-1--reference-16.jpg',
          ];

          const [chaptersRes, scenesRes, assetsRes] = await Promise.all([
            sb.from('book_studio_chapters').select('id,video_asset_id,audio_asset_id').eq('book_id', BOOK_ID),
            sb.from('book_studio_scenes').select('id,image_asset_id,audio_asset_id').eq('book_id', BOOK_ID),
            sb.from('book_studio_assets').select('id,kind,relative_path').eq('book_id', BOOK_ID),
          ]);
          for (const r of [chaptersRes, scenesRes, assetsRes]) if (r.error) throw r.error;

          const chapters = chaptersRes.data ?? [];
          const assets = assetsRes.data ?? [];
          const activeVideoIds = new Set(chapters.map(c => c.video_asset_id).filter(Boolean));
          if (chapters.length !== 20 || activeVideoIds.size !== 20) {
            throw new Error(`Guard failed: expected 20 chapters and 20 active videos, got ${chapters.length}/${activeVideoIds.size}`);
          }

          const deleteAssets = assets.filter(a =>
            a.kind === 'chapter_audio' ||
            a.kind === 'scene_audio' ||
            (a.kind === 'chapter_video' && !activeVideoIds.has(a.id))
          );
          if (deleteAssets.some(a => activeVideoIds.has(a.id))) throw new Error('Refusing to delete an active chapter video');

          const paths = [...new Set([...deleteAssets.map(a => a.relative_path), ...extraOrphans])];
          for (let i = 0; i < paths.length; i += 100) {
            const batch = paths.slice(i, i + 100);
            const { error } = await sb.storage.from(BUCKET).remove(batch);
            if (error) throw new Error(`Storage delete failed: ${error.message}`);
          }

          const audioIds = deleteAssets.filter(a => a.kind === 'chapter_audio' || a.kind === 'scene_audio').map(a => a.id);
          const obsoleteVideoIds = deleteAssets.filter(a => a.kind === 'chapter_video').map(a => a.id);

          let q = await sb.from('book_studio_chapters').update({ audio_asset_id: null }).eq('book_id', BOOK_ID);
          if (q.error) throw q.error;
          q = await sb.from('book_studio_scenes').update({ audio_asset_id: null, audio_status: 'missing' }).eq('book_id', BOOK_ID);
          if (q.error) throw q.error;
          const ids = [...audioIds, ...obsoleteVideoIds];
          if (ids.length) {
            q = await sb.from('book_studio_assets').delete().in('id', ids);
            if (q.error) throw q.error;
          }

          console.log(JSON.stringify({
            ok: true,
            preservedActiveVideos: activeVideoIds.size,
            deletedStandaloneAudioAssets: audioIds.length,
            deletedObsoleteVideoAssets: obsoleteVideoIds.length,
            deletedExtraOrphans: extraOrphans.length,
            storagePathsRemoved: paths.length,
          }, null, 2));
          JS
