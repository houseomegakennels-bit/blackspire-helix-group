name: Beta feedback authorization

on:
  pull_request:
    paths:
      - '.github/workflows/beta-feedback-authorization.yml'
      - '.node-version'
      - 'frontend/package*.json'
      - 'frontend/src/app/api/beta/feedback/**'
      - 'frontend/src/lib/beta-server.ts'
      - 'frontend/src/lib/operator-access.ts'
      - 'frontend/src/lib/buyer-engine-auth.ts'
      - 'frontend/tests/beta-feedback-authorization.test.mjs'

permissions:
  contents: read

concurrency:
  group: beta-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise route and service authorization with synthetic transport
        run: node --test frontend/tests/beta-feedback-authorization.test.mjs
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend types
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit
