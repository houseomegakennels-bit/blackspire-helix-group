name: Blackspire Command CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: blackspire-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Test-only, non-secret configuration. None of these values are real credentials.
# Deliberately NOT set here: COMMAND_ADMIN_TOKEN and HERMES_TEST_PROVIDER. The test suite is self-contained —
# each test file sets whatever admin token / provider mode it needs at import time (a documented convention
# throughout tests/*.test.js), and some files (e.g. tests/integration.test.js) intentionally exercise the
# built-in default admin token or real (non-mock) provider-selection logic. Overriding either at the job
# level would silently break those tests instead of testing anything real.
env:
  NODE_ENV: test
  SESSION_SECRET: ci-test-session-secret-not-a-real-secret-000000
  TELEGRAM_ALLOWED_USERS: '1001'
  PORT: '8787'
  TRUST_PROXY: 'false'
  RATE_LIMIT_DISABLED: 'false'

jobs:
  build-and-test:
    name: Install, migrate, test, build, lint, typecheck, scan, audit
    runs-on: ubuntu-latest
    # Bounded safety ceiling: the full job (install → audit) completes in a couple of minutes.
    # This is only a backstop so a future runtime hang fails fast instead of burning the 6h default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # node-version-file must read .node-version — the single canonical runtime pin (22.23.1), the same one
      # the devcontainer image (1-22-bookworm) and scripts/bootstrap-development.sh use. package.json's
      # "engines" field is a deliberately broad *compatibility* range (>=22.5.0 <25) for consumers, NOT the
      # runtime to test on: setup-node resolves it to the newest satisfying release (Node 24), which the
      # production runtime guard in packages/shared/security.js rejects (it pins major 22 exactly, because the
      # durable-VPS profile is only validated on Node 22). Reading engines here made CI boot the app under
      # Node 24, the production-mode API aborted at startup, and the test suite hung. Pinning to .node-version
      # keeps CI on the exact runtime the app is built, reviewed, and deployed for.
      - name: Set up Node.js (project-required version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: npm ci
        run: npm ci --ignore-scripts 2>&1 | tee ci-logs/01-install.log

      - name: Clean local Blackspire Command state
        run: rm -rf .blackspire-command

      - name: Run database migrations
        run: BLACKSPIRE_DB_PATH="$RUNNER_TEMP/blackspire-ci/command.sqlite" BLACKSPIRE_RUN_MIGRATIONS=true npm run db:migrate 2>&1 | tee ci-logs/02-db-migrate.log

      - name: Run test suite
        run: npm test 2>&1 | tee ci-logs/03-test.log

      - name: Run build check
        run: npm run build 2>&1 | tee ci-logs/04-build.log

      - name: Run lint check
        run: npm run lint 2>&1 | tee ci-logs/05-lint.log

      - name: Run typecheck
        run: npm run typecheck 2>&1 | tee ci-logs/06-typecheck.log

      - name: Run secret scan
        run: npm run security:scan 2>&1 | tee ci-logs/07-security-scan.log

      - name: Run npm audit (high severity and above)
        run: npm audit --audit-level=high 2>&1 | tee ci-logs/08-npm-audit.log

      - name: Validate tracked shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n 2>&1 | tee ci-logs/09-shell-syntax.log

      - name: Validate whitespace
        env:
          BLACKSPIRE_CI_EVENT_NAME: ${{ github.event_name }}
          BLACKSPIRE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BLACKSPIRE_CI_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-validate-whitespace-range.sh 2>&1 | tee ci-logs/10-diff-check.log

      - name: Run read-only production preflight
        run: npm run production:preflight 2>&1 | tee ci-logs/11-production-preflight.log

      - name: Record immutable build metadata
        run: |
          mkdir -p ci-artifacts
          node_version="$(node --version)"
          commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          printf '{"commit":"%s","tree":"%s","node":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$commit_sha" "$tree_sha" "$node_version" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > ci-artifacts/build-metadata.json

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: blackspire-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blackspire-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/**/*.log
            /home/runner/.npm/_logs/*.log
          if-no-files-found: ignore
          retention-days: 14
